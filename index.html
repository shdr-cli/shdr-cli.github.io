<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>shdr // profile</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    :root {
      --bg-color: #08090e;
      --card-bg: rgba(13, 15, 26, 0.7);
      --card-border: rgba(99, 102, 241, 0.2);
      
      --accent-cyan: #38bdf8;
      --accent-purple: #818cf8;
      
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      
      --btn-bg: rgba(255, 255, 255, 0.03);
      --btn-border: rgba(255, 255, 255, 0.08);
      --btn-hover-bg: rgba(56, 189, 248, 0.08);
      --btn-hover-border: rgba(56, 189, 248, 0.4);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Space Grotesk', sans-serif;
      background-color: var(--bg-color);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      color: var(--text-main);
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image: 
        radial-gradient(circle at 50% 20%, rgba(99, 102, 241, 0.15) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(56, 189, 248, 0.1) 0%, transparent 40%),
        linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 40px 40px, 40px 40px;
      z-index: 0;
    }

    @keyframes cardEntrance {
      0% {
        opacity: 0;
        transform: translateY(30px) scale(0.96);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes itemFadeUp {
      0% {
        opacity: 0;
        transform: translateY(16px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .profile-card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 440px;
      background: var(--card-bg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-radius: 28px;
      border: 1px solid var(--card-border);
      padding: 2.2rem 1.8rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 
        0 20px 50px rgba(0, 0, 0, 0.6),
        0 0 40px rgba(99, 102, 241, 0.1);
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
      animation: cardEntrance 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .profile-card:hover {
      border-color: rgba(99, 102, 241, 0.35);
      box-shadow: 
        0 25px 60px rgba(0, 0, 0, 0.7),
        0 0 50px rgba(99, 102, 241, 0.2);
    }

    .avatar-container,
    .name,
    .links-group,
    .stats-wrapper {
      opacity: 0;
      animation: itemFadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .avatar-container {
      position: relative;
      margin-bottom: 1.2rem;
      animation-delay: 0.2s;
    }

    .name {
      font-size: 2.4rem;
      font-weight: 700;
      letter-spacing: -0.04em;
      color: var(--text-main);
      margin-bottom: 0.2rem;
      text-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
      padding-bottom: 10px;
      animation-delay: 0.35s;
    }

    .links-group {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
      margin-bottom: 1.6rem;
      animation-delay: 0.45s;
    }

    .stats-wrapper {
      width: 100%;
      border-radius: 16px;
      overflow: hidden;
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid var(--btn-border);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 6px;
      transition: border-color 0.3s ease;
      animation-delay: 0.55s;
    }

    .avatar-wrapper {
      position: relative;
      width: 140px;
      height: 140px;
      border-radius: 50%;
      padding: 3px;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
    }

    .avatar {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      background-color: var(--bg-color);
      border: 3px solid var(--bg-color);
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .action-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 0.85rem 1.2rem;
      background: var(--btn-bg);
      border: 1px solid var(--btn-border);
      border-radius: 16px;
      color: var(--text-main);
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 500;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .action-btn .btn-content {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .action-btn i {
      font-size: 1.1rem;
      color: var(--text-muted);
      transition: color 0.2s ease, transform 0.2s ease;
    }

    .action-btn .arrow-icon {
      font-size: 0.8rem;
      opacity: 0.4;
      transform: translateX(0);
      transition: all 0.2s ease;
    }

    .action-btn:hover {
      background: var(--btn-hover-bg);
      border-color: var(--btn-hover-border);
      transform: translateY(-2px);
      color: #fff;
    }

    .action-btn:hover i {
      color: var(--accent-cyan);
      transform: scale(1.08);
    }

    .action-btn:hover .arrow-icon {
      opacity: 1;
      transform: translateX(4px);
      color: var(--accent-cyan);
    }

    .stats-wrapper:hover {
      border-color: rgba(99, 102, 241, 0.3);
    }

    .stats-img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 12px;
    }

    @media (max-width: 480px) {
      .profile-card {
        padding: 1.8rem 1.2rem;
        border-radius: 22px;
      }

      .avatar-wrapper {
        width: 120px;
        height: 120px;
      }

      .name {
        font-size: 2rem;
      }
    }
  </style>
</head>

<body>

  <main class="profile-card">
    <div class="avatar-container">
      <div class="avatar-wrapper">
        <img class="avatar" src="https://avatars.githubusercontent.com/u/142397443?v=4" alt="shdr">
      </div>
    </div>

    <h1 class="name">shdr</h1>

    <div class="links-group">
      <a href="https://github.com/shdr-cli" class="action-btn" target="_blank" rel="noopener noreferrer">
        <div class="btn-content">
          <i class="fa-brands fa-github"></i>
          <span>GitHub</span>
        </div>
        <i class="fa-solid fa-arrow-right arrow-icon"></i>
      </a>
    </div>

    <div class="stats-wrapper">
      <img 
        class="stats-img"
        src="https://github-readme-stats-fast.vercel.app/api/top-langs/?username=shdr-cli&amp;layout=compact&amp;bg_color=00000000&amp;title_color=38bdf8&amp;text_color=94a3b8&amp;hide_border=true" 
      />
    </div>
  </main>

</body>

</html>
